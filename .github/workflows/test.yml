name: test-and-package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.20.1+1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Core, CLI and desktop review-state tests
        run: mvn -B verify
      - name: Distributable JAR workflow
        run: python scripts/install_smoke.py
      - name: Package runtime-included app
        run: python scripts/package.py --skip-build
      - name: Extract, exercise and remove installed app
        run: python -c "import pathlib,subprocess,sys; p=next(pathlib.Path('dist').glob('*.zip')); subprocess.run([sys.executable,'scripts/install_smoke.py','--archive',str(p)],check=True)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: annotrail-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.jar
            dist/SHA256SUMS
          retention-days: 14
